<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днем Рождения!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 50px;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background: #ff4081;
            color: white;
            border: none;
            border-radius: 5px;
            transition: opacity 0.3s, transform 0.2s;
            z-index: 10;
        }
        button:hover { transform: scale(1.05); }
        button:active { transform: scale(0.95); }

        #message {
            display: none;
            font-size: 24px;
            color: #333;
            max-width: 90%;
            line-height: 1.5;
            z-index: 10;
            padding: 30px 0;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .show {
            display: block !important;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .hide {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }

        /* === БОЛЬШИЕ КАРТИНКИ СВЕРХУ И СНИЗУ === */
        .top-image,
        .bottom-image {
            width: 400px;
            height: auto;
            opacity: 0;
            transform: translateY(-30px);
            transition: all 0.7s ease-out;
            z-index: 5;
            pointer-events: none;
        }

        .top-image {
            margin-bottom: 20px;
        }

        .bottom-image {
            margin-top: 20px;
            transform: translateY(30px);
        }

        .top-image.visible,
        .bottom-image.visible {
            opacity: 1;
            transform: translateY(0);
            animation: float 2.5s ease-in-out infinite;
        }

        .bottom-image.visible {
            animation-delay: 0.2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* === ТЕКСТ ПОД НИЖНЕЙ КАРТИНКОЙ === */
        .bottom-text {
            font-size: 16px;
            color: #888;
            font-style: italic;
            margin-top: 15px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease-out;
        }
        .bottom-text.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <!-- Картинка СВЕРХУ -->
    <img src="https://i.pinimg.com/originals/c1/d9/0e/c1d90efb3af80b29428c213f24c1c85b.gif"
         alt="🎁"
         class="top-image"
         id="imgTop">

    <button id="celebrateBtn" onclick="celebrate()">поздравиться ✨</button>

    <div id="message">
        <p style="margin: 0 0 15px 0; font-style: italic; color: #ff4081; font-size: 28px;">
            ПОЗДРАВЛЯЮ С ДНЕМ РОЖДЕНИЯ
        </p>
        <p>желаю тебе:</p>
        <p style="line-height: 2;">
             улыбок<br>
             монеток<br>
             успеха<br>
             вкусной еды
        </p>
    </div>

    <!-- Картинка СНИЗУ -->
    <img src="https://i.pinimg.com/736x/5c/68/0e/5c680e344ef044c7b99831b55c28be47.jpg"
         alt="🎈"
         class="bottom-image"
         id="imgBottom">

    <!-- Текст под нижней картинкой -->
    <p class="bottom-text" id="bottomText">Включи Смешарики 5 сезон 45 серия 00:51, там будет послание</p>

    <script>
        function celebrate() {
            // Конфетти
            confetti({
                particleCount: 150,
                spread: 90,
                origin: { y: 0.6 }
            });

            const btn = document.getElementById('celebrateBtn');
            const message = document.getElementById('message');
            const imgTop = document.getElementById('imgTop');
            const imgBottom = document.getElementById('imgBottom');
            const bottomText = document.getElementById('bottomText');

            // Скрываем кнопку
            btn.classList.add('hide');

            setTimeout(() => {
                btn.style.display = 'none';
                message.classList.add('show');

                // Показываем картинки и текст с задержкой
                setTimeout(() => {
                    imgTop.classList.add('visible');
                }, 200);
                setTimeout(() => {
                    imgBottom.classList.add('visible');
                }, 400);
                setTimeout(() => {
                    bottomText.classList.add('visible');
                }, 600);

                // Ещё конфетти по краям
                confetti({ particleCount: 100, angle: 60, spread: 80, origin: { x: 0, y: 0.6 } });
                confetti({ particleCount: 100, angle: 120, spread: 80, origin: { x: 1, y: 0.6 } });
            }, 400);
        }
    </script>
</body>
</html>
